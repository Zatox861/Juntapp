<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#00eaff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base rounded card -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#020617" stroke="url(#neonGrad)" stroke-width="4"/>

  <!-- Glowing Game Cube / Dice Face -->
  <g filter="url(#glow)">
    <!-- Dice Outer Frame (Isometric tilted cube) -->
    <path d="M64 24L100 44V84L64 104L28 84V44L64 24Z" fill="#0f172a" stroke="url(#neonGrad)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Top Face dividing lines -->
    <path d="M64 64L100 44M64 64V104M64 64L28 44" stroke="url(#neonGrad)" stroke-width="2.5" stroke-linejoin="round" opacity="0.8"/>

    <!-- Pips (Puntos de dados en neón) -->
    <!-- Top pip -->
    <circle cx="64" cy="44" r="4.5" fill="#00eaff"/>
    <!-- Left pips -->
    <circle cx="44" cy="70" r="3.5" fill="#a855f7"/>
    <circle cx="50" cy="86" r="3.5" fill="#a855f7"/>
    <!-- Right pips -->
    <circle cx="84" cy="70" r="3.5" fill="#ec4899"/>
    <circle cx="78" cy="86" r="3.5" fill="#ec4899"/>
  </g>

  <!-- Sparkle Accent -->
  <path d="M96 22L98 28L104 30L98 32L96 38L94 32L88 30L94 28L96 22Z" fill="#00eaff"/>
</svg>
